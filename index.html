<!DOCTYPE html>
<html lang="en">

<head>
<!-- Pages deployment forecast preservation test -->
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YouStorm</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="css/main.css">

</head>

<body>

<header>

<div id="logo">
    <img src="./images/youstorm-logo.png" alt="YouStorm">
</div>

<div id="modelSelector">

<button
    id="gfsButton"
    class="modelButton active"
>
    GFS
</button>

<button
    id="ecmwfButton"
    class="modelButton"
>
    ECMWF
</button>

</div>

</header>

<div id="mainContainer">
<button id="layersToggle">Layers</button>
<aside id="sidebar">

    <h2>Layers</h2>

     <label>
        <input
            type="checkbox"
            id="webglTemperatureToggle"
            checked
        >
        Temperature
    </label>

    <label>
        <input
            type="checkbox"
            id="webglPrecipitationToggle"
        >
        Precipitation
    </label>

</aside>

<div id="map">

<canvas id="weatherWebGL"></canvas>

<div id="temperatureLegend">

    <div class="legendTitle">
        Temperature
    </div>

    <div class="legendUnit">
        2 m above ground
    </div>

    <div class="temperatureGradient"></div>

    <div class="temperatureGradientLabels">
        <span>-5°C</span>
        <span>35°C</span>
    </div>

    </div>

        <div id="precipitationLegend"></div>

        <div id="forecastControl">

        <span id="forecastControlLabel">
            +000 h
        </span>

        <button id="forecastPlayButton">
            ▶
        </button>

        <input
            id="forecastSlider"
            type="range"
            min="0"
            max="2"
            step="1"
            value="0">

        <div id="forecastUTCTime"></div>
        
    </div>

</div>

<footer>

Forecast:
<span id="forecastHour">

+000 h

</span>

|

Valid:
<span id="timezone">
--
</span>

|

Lat:
<span id="lat">

--

</span>

|

Lon:
<span id="lon">

--

</span>

|

Zoom:
<span id="zoom">

2

</span>

</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>

</body>

</html>
