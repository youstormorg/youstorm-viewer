<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YouStorm</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="css/main.css">

</head>

<body>

<header>

<div id="logo">

🌩 YouStorm

</div>

<div id="headerRight">

Weather Viewer

</div>

</header>

<div id="mainContainer">

<aside id="sidebar">

<h2>Layers</h2>

<p>Coming soon...</p>

</aside>

<div id="map">

    <div id="temperatureLegend">

        <div class="legendTitle">
            Temperature
        </div>

        <div class="legendUnit">
            2 m above ground
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#4b6cb7"></span>
            <span class="legendLabel">&lt; 0°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#6fa8dc"></span>
            <span class="legendLabel">0–5°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#9fc5e8"></span>
            <span class="legendLabel">5–10°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#b6d7a8"></span>
            <span class="legendLabel">10–15°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#ffd966"></span>
            <span class="legendLabel">15–20°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#f6b26b"></span>
            <span class="legendLabel">20–25°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#e06666"></span>
            <span class="legendLabel">25–30°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#cc0000"></span>
            <span class="legendLabel">30–35°C</span>
        </div>

        <div class="legendRow">
            <span class="legendColour" style="background:#990000"></span>
            <span class="legendLabel">≥ 35°C</span>
        </div>

    </div>

    <div id="forecastControl">

        <span id="forecastControlLabel">
            +000 h
        </span>

        <input
            id="forecastSlider"
            type="range"
            min="0"
            max="2"
            step="1"
            value="0">

    </div>

</div>

<footer>

Forecast:
<span id="forecastHour">

+000 h

</span>

|

Valid:
<span id="timezone">
--
</span>

|

Lat:
<span id="lat">

--

</span>

|

Lon:
<span id="lon">

--

</span>

|

Zoom:
<span id="zoom">

2

</span>

</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>

</body>

</html>
