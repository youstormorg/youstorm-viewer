<!DOCTYPE html>
<html lang="en">

<head>
<!-- Pages deployment forecast preservation test -->
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YouStorm</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="css/main.css">

</head>

<body>

<header>

<div id="headerLeft">

    <div id="logo">
        <img src="./images/youstorm-logo.png" alt="YouStorm">
    </div>

    <button id="layersToggle">
        Layers
    </button>

</div>

<div id="modelSelector">

<button
    id="gfsButton"
    class="modelButton active"
>
    GFS
</button>

<button
    id="ecmwfButton"
    class="modelButton"
>
    ECMWF
</button>

</div>

<button id="legendToggle">
    Legend
</button>

</header>

<div id="mainContainer">

<aside id="sidebar">

     <label>
        <input
            type="checkbox"
            id="webglTemperatureToggle"
            checked
        >
        Temperature
    </label>

    <label>
        <input
            type="checkbox"
            id="webglPrecipitationToggle"
        >
        Precipitation
    </label>

</aside>

<div id="map">

<canvas id="weatherWebGL"></canvas>

<div id="temperatureLegend"></div>

        <div id="precipitationLegend"></div>

        <div id="forecastControl">

        <span id="forecastControlLabel">
            +000 h
        </span>

        <button id="forecastPlayButton">
            ▶
        </button>

        <input
            id="forecastSlider"
            type="range"
            min="0"
            max="2"
            step="1"
            value="0">

        <div id="forecastUTCTime"></div>
        
    </div>

</div>

<footer>

<span id="forecastHour" style="display:none;">
+000 h
</span>

<span id="timezone" style="display:none;">
--
</span>

Lat:
<span id="lat">
--
</span>

|

Lon:
<span id="lon">
--
</span>

|

Zoom:
<span id="zoom">
2
</span>

<div id="opacityControl">

    <input
        id="opacitySlider"
        type="range"
        min="0"
        max="100"
        step="1"
        value="100">

    <span id="opacityLabel">
        Opacity
    </span>

</div>

</footer>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>

</body>

</html>
