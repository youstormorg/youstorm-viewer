<!DOCTYPE html>
<html lang="en">

<head>
<!-- Pages deployment forecast preservation test -->
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>YouStorm</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="css/main.css">

<link rel="icon" type="image/png" href="images/youstorm-logo.png">

</head>

<body>


<header>

    <div id="headerLeft">

        <div id="logo">
            <img src="./images/youstorm-logo.png" alt="YouStorm">
        </div>

        <div id="modelSelector">

            <button
                id="ecmwfButton"
                class="modelButton active"
            >
                ECMWF
            </button>

            <button
                id="gfsButton"
                class="modelButton"
            >
                GFS
            </button>

        </div>

        <button id="layersToggle">
            Layers
        </button>

        <button id="legendToggle">
            Legend
        </button>

        <button id="probeToggle" class="active">Probe</button>

    </div>

</header>

<div id="mainContainer">

<div id="weatherReadout">
    <div id="weatherReadoutLocation">
        --°N, --°E
    </div>

    <div id="weatherReadoutValue">
        --
    </div>
</div>

<div id="fixedProbeReadout" style="display: none;">
    <div id="fixedProbeLocation">
        Fixed probe
    </div>

    <div id="fixedProbeTime">
        --
    </div>

    <div id="fixedProbeValue">
        --
    </div>

    <button id="fixedProbeClose" type="button" title="Remove fixed probe">
        ×
    </button>
</div>


<aside id="sidebar">

    <div class="layerSection">
        <div class="layerSectionTitle">Weather</div>

    <div class="weatherLayerRow">
        <label>
            <input
                type="checkbox"
                id="webglTemperatureToggle"
                checked
            >
            Temperature
        </label>

        <button
            type="button"
            class="renderModeToggle"
            id="temperatureRenderModeToggle"
            title="Switch to nearest-neighbour rendering"
            aria-label="Switch temperature to nearest-neighbour rendering"
        >N</button>
    </div>

    <div class="weatherLayerRow">
        <label>
            <input
                type="checkbox"
                id="webglWindToggle"
            >
            Wind
        </label>

        <button
            type="button"
            class="renderModeToggle"
            id="windRenderModeToggle"
            title="Switch to nearest-neighbour rendering"
            aria-label="Switch wind to nearest-neighbour rendering"
        >N</button>
    </div>

    <div class="weatherLayerRow">
        <label>
            <input
                type="checkbox"
                id="webglStreamlinesToggle"
            >
            Streamlines
        </label>
    </div>

    <div class="weatherLayerRow">
        <label>
            <input
                type="checkbox"
                id="webglWindParticlesToggle"
                checked
            >
            Wind particles
        </label>
    </div>

    <div class="weatherLayerRow">
        <label>
            <input
                type="checkbox"
                id="webglPrecipitationToggle"
                checked
            >
            Precipitation
        </label>

        <div class="precipitationMenu">
            <button
                type="button"
                id="precipitationMenuToggle"
                class="precipitationMenuToggle"
                aria-label="Choose precipitation accumulation"
                aria-expanded="false"
                aria-controls="precipitationTypeSelect"
                title="Choose precipitation accumulation"
            >
                <span aria-hidden="true">▾</span>
            </button>

            <select
                id="precipitationTypeSelect"
                aria-label="Precipitation accumulation type"
                title="Choose precipitation accumulation type"
            >
                <option value="threeHourFromTotal">3-hour</option>
                <option value="total">Total</option>
            </select>
        </div>

        <button
            type="button"
            class="renderModeToggle"
            id="precipitationRenderModeToggle"
            title="Switch to nearest-neighbour rendering"
            aria-label="Switch precipitation to nearest-neighbour rendering"
        >N</button>
    </div>

    <div class="weatherLayerRow" id="mslContoursRow">
        <label>
            <input
                type="checkbox"
                id="webglMSLContoursToggle"
                checked
            >
            MSLP contours
        </label>
    </div>

    </div>

    <div class="layerSection">
        <div class="layerSectionTitle">Map</div>

        <label>
            <input
                type="checkbox"
                id="webglCoastlineToggle"
                checked
            >
            Coasts
        </label>

        <label>
            <input
                type="checkbox"
                id="capitalLabelsToggle"
                checked
            >
            Capitals
        </label>
    </div>

</aside>

<div id="map">

<canvas id="weatherWebGL"></canvas>

<div id="fixedProbeMarker" style="display: none;"></div>

<div id="temperatureLegend"></div>
<div id="precipitationLegend"></div>
<div id="windLegend"></div>
        <div id="forecastControl">

        <span id="forecastControlLabel">
            +000 h
        </span>

        <button id="forecastPlayButton">
            ▶
        </button>

        <input
            id="forecastSlider"
            type="range"
            min="0"
            max="2"
            step="1"
            value="0">

        <div id="forecastUTCTime"></div>
        
    </div>

</div>

<footer>

<span id="forecastHour" style="display:none;">
+000 h
</span>

<span id="timezone" style="display:none;">
--
</span>

<div id="coordinateDisplay">

    Lat:
    <span id="lat">
    --
    </span>

    |

    Lon:
    <span id="lon">
    --
    </span>

    |

    Zoom:
    <span id="zoom">
    2
    </span>

</div>

<div id="opacityControl">

    <input
        id="opacitySlider"
        type="range"
        min="0"
        max="100"
        step="1"
        value="100">

    <span id="opacityLabel">
        Opacity
    </span>

</div>

</footer>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/vendor/timezoneturbo.umd.min.js"></script>
<script type="module" src="js/app.js"></script>

<!-- Cloudflare Web Analytics -->
 <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "f4bb64dea12645aa88a4c7e954c2e3bc"}'></script>
<!-- End Cloudflare Web Analytics -->

</body>

</html>
