name: Test ECMWF Metadata

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install processing packages
        run: |
          python -m pip install --upgrade pip
          pip install xarray==2026.7.0
          pip install cfgrib==0.9.15.1
          pip install eccodes==2.48.0
          pip install ecmwf-opendata==0.3.34
          pip install requests==2.34.2

      - name: Download ECMWF forecast
        run: |
          python processing/download_ecmwf.py
          ls -lh data/ecmwf/*.grib2

      - name: Test ECMWF GRIB metadata with ecCodes
        run: |
          python - <<'PY'
          from eccodes import (
              codes_grib_new_from_file,
              codes_get,
              codes_release,
          )

          for hour in (0, 24, 72, 144):
              filename = f"data/ecmwf/ecmwf_2t_f{hour:03d}.grib2"

              with open(filename, "rb") as f:
                  gid = codes_grib_new_from_file(f)

                  data_date = codes_get(gid, "dataDate")
                  data_time = codes_get(gid, "dataTime")
                  step = codes_get(gid, "step")
                  step_units = codes_get(gid, "stepUnits")

                  print(
                      f"f{hour:03d}: "
                      f"dataDate={data_date}, "
                      f"dataTime={data_time}, "
                      f"step={step}, "
                      f"stepUnits={step_units}"
                  )

                  codes_release(gid)
          PY

      - name: Test ECMWF metadata generation
        run: |
          python processing/create_ecmwf_metadata.py