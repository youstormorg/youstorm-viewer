name: Test GFS Metadata

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install processing packages
        run: |
          python -m pip install --upgrade pip
          pip install xarray==2026.7.0
          pip install cfgrib==0.9.15.1
          pip install eccodes==2.48.0
          pip install requests==2.34.2

      - name: Download representative GFS GRIB files
        run: |
          mkdir -p data/gfs

          python - <<'PY'
          import requests

          date = "20261003"
          cycle = "06"

          url = "https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl"

          common = {
              "subregion": "",
              "leftlon": 0,
              "rightlon": 359.75,
              "toplat": 90,
              "bottomlat": -90,
              "dir": f"/gfs.{date}/{cycle}/atmos",
          }

          tests = [
              (
                  "gfs_temp_global_f000.grib2",
                  "gfs.t06z.pgrb2.0p25.f000",
                  {
                      "var_TMP": "on",
                      "lev_2_m_above_ground": "on",
                  },
              ),
              (
                  "gfs_temp_global_f144.grib2",
                  "gfs.t06z.pgrb2.0p25.f144",
                  {
                      "var_TMP": "on",
                      "lev_2_m_above_ground": "on",
                  },
              ),
              (
                  "gfs_precip_global_f003.grib2",
                  "gfs.t06z.pgrb2.0p25.f003",
                  {
                      "var_APCP": "on",
                      "lev_surface": "on",
                  },
              ),
              (
                  "gfs_precip_global_f144.grib2",
                  "gfs.t06z.pgrb2.0p25.f144",
                  {
                      "var_APCP": "on",
                      "lev_surface": "on",
                  },
              ),
          ]

          for output_name, grib_name, variables in tests:

              params = {
                  **common,
                  **variables,
                  "file": grib_name,
              }

              print()
              print(f"Downloading {output_name}")

              response = requests.get(
                  url,
                  params=params,
                  timeout=120
              )

              response.raise_for_status()

              output = (
                  f"data/gfs/{output_name}"
              )

              with open(output, "wb") as f:
                  f.write(response.content)

              print(
                  f"Downloaded {output}: "
                  f"{len(response.content):,} bytes"
              )
          PY

          ls -lh data/gfs/*.grib2

      - name: Test GFS metadata extraction
        run: |
          python - <<'PY'
          import xarray as xr

          files = [
              "data/gfs/gfs_temp_global_f000.grib2",
              "data/gfs/gfs_temp_global_f144.grib2",
              "data/gfs/gfs_precip_global_f003.grib2",
              "data/gfs/gfs_precip_global_f144.grib2",
          ]

          for filename in files:

              print()
              print(f"Reading {filename}")

              with xr.open_dataset(
                  filename,
                  engine="cfgrib"
              ) as ds:

                  print(
                      "initialisation:",
                      str(ds["time"].values)
                  )

                  print(
                      "valid_time:",
                      str(ds["valid_time"].values)
                  )
          PY