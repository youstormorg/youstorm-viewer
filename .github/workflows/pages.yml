name: Deploy YouStorm to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install forecast processing packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            xarray==2026.7.0 \
            cfgrib==0.9.15.1 \
            eccodes==2.48.0 \
            ecmwf-opendata==0.3.34 \
            requests==2.34.2

      - name: Build forecast
        run: |
          python processing/update_viewer.py --force

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r css _site/
          cp -r js _site/
          cp -r images _site/
          mkdir -p _site/data/gfs
          mkdir -p _site/data/ecmwf

          cp data/gfs/gfs_temp_global_*.bin _site/data/gfs/
          cp data/gfs/gfs_precip_global_*.bin _site/data/gfs/
          cp data/gfs/gfs_temperature_metadata.json _site/data/gfs/
          cp data/gfs/gfs_precipitation_metadata.json _site/data/gfs/

          cp data/ecmwf/ecmwf_2t_*.bin _site/data/ecmwf/
          cp data/ecmwf/ecmwf_temperature_metadata.json _site/data/ecmwf/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4