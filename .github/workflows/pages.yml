name: Deploy YouStorm to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          bash processing/assemble_pages.sh

          # Preserve the forecast currently deployed on GitHub Pages.
          for hour in $(seq 0 3 144); do
            curl -fL "https://youstormorg.github.io/youstorm-viewer/data/gfs/gfs_temp_global_f$(printf '%03d' $hour).bin" \
              -o "_site/data/gfs/gfs_temp_global_f$(printf '%03d' $hour).bin"
          done

          for hour in $(seq 3 3 144); do
            curl -fL "https://youstormorg.github.io/youstorm-viewer/data/gfs/gfs_precip_global_f$(printf '%03d' $hour)_u16.bin" \
              -o "_site/data/gfs/gfs_precip_global_f$(printf '%03d' $hour)_u16.bin"
          done

          for hour in $(seq 0 3 144); do
            curl -fL "https://youstormorg.github.io/youstorm-viewer/data/ecmwf/ecmwf_2t_f$(printf '%03d' $hour).bin" \
              -o "_site/data/ecmwf/ecmwf_2t_f$(printf '%03d' $hour).bin"
          done

          for hour in $(seq 3 3 144); do
            curl -fL "https://youstormorg.github.io/youstorm-viewer/data/ecmwf/ecmwf_precip_f$(printf '%03d' $hour)_u16.bin" \
              -o "_site/data/ecmwf/ecmwf_precip_f$(printf '%03d' $hour)_u16.bin"
          done

          for hour in $(seq 0 3 144); do
            for component in 10u 10v; do
              curl -fL "https://youstormorg.github.io/youstorm-viewer/data/ecmwf/ecmwf_${component}_f$(printf '%03d' $hour).bin" \
                -o "_site/data/ecmwf/ecmwf_${component}_f$(printf '%03d' $hour).bin"
            done
          done

          curl -fL https://youstormorg.github.io/youstorm-viewer/data/ecmwf/ecmwf_wind_metadata.json \
            -o _site/data/ecmwf/ecmwf_wind_metadata.json

          curl -fL https://youstormorg.github.io/youstorm-viewer/data/gfs/gfs_temperature_metadata.json \
            -o _site/data/gfs/gfs_temperature_metadata.json

          curl -fL https://youstormorg.github.io/youstorm-viewer/data/gfs/gfs_precipitation_metadata.json \
            -o _site/data/gfs/gfs_precipitation_metadata.json

          curl -fL https://youstormorg.github.io/youstorm-viewer/data/ecmwf/ecmwf_temperature_metadata.json \
            -o _site/data/ecmwf/ecmwf_temperature_metadata.json

          curl -fL https://youstormorg.github.io/youstorm-viewer/data/ecmwf/ecmwf_precipitation_metadata.json \
            -o _site/data/ecmwf/ecmwf_precipitation_metadata.json

      - name: Report Pages site size
        run: |
          python - <<'PY'
          import os

          root = "_site"
          limit = 1_000_000_000
          totals = {}

          for directory, _, filenames in os.walk(root):
              for filename in filenames:
                  path = os.path.join(directory, filename)
                  size = os.path.getsize(path)
                  relative = os.path.relpath(path, root)
                  category = relative.split(os.sep)[0]
                  totals[category] = totals.get(category, 0) + size

          total = sum(totals.values())

          print(f"Uncompressed site size: {total:,} bytes")
          print(f"Decimal GB: {total / 1_000_000_000:.4f}")
          print(f"Limit used: {total / limit * 100:.2f}%")
          print(f"Remaining: {limit - total:,} bytes")

          print("\nBreakdown:")
          for category, size in sorted(
              totals.items(), key=lambda item: item[1], reverse=True
          ):
              print(
                  f"  {category}: {size:,} bytes "
                  f"({size / 1_000_000:.2f} MB)"
              )

          if total >= 900_000_000:
              print("::warning::Pages site is at or above 90% of the 1 GB limit.")
          elif total >= 800_000_000:
              print("::warning::Pages site is at or above 80% of the 1 GB limit.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4