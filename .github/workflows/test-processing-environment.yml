name: Test Processing Environment

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install processing packages
        run: |
          python -m pip install --upgrade pip
          pip install xarray==2026.7.0
          pip install cfgrib==0.9.15.1
          pip install eccodes==2.48.0
          pip install ecmwf-opendata==0.3.34
          pip install requests==2.34.2

      - name: Test imports
        run: |
          python -c "import xarray; print('xarray', xarray.__version__)"
          python -c "import cfgrib; print('cfgrib', cfgrib.__version__)"
          python -c "import eccodes; print('eccodes', eccodes.__version__)"
          python -c "import ecmwf.opendata; print('ecmwf-opendata imported')"
          python -c "import requests; print('requests', requests.__version__)"

      - name: Test ecCodes
        run: |
          python -c "from eccodes import codes_grib_new_from_samples, codes_release; gid = codes_grib_new_from_samples('GRIB2'); print('ecCodes GRIB2 sample created successfully'); codes_release(gid)"

      - name: Test GFS cycle discovery
        run: |
          python -c "from processing.download_gfs import find_latest_cycle; date, cycle = find_latest_cycle(); print(f'Latest GFS cycle: {date} {cycle}Z')"

      - name: Test GFS GRIB download and reading
        run: |
          python -c "import requests; import xarray as xr; from processing.download_gfs import find_latest_cycle; date, cycle = find_latest_cycle(); filename = f'gfs.t{cycle}z.pgrb2.0p25.f000'; params = {'file': filename, 'var_TMP': 'on', 'lev_2_m_above_ground': 'on', 'subregion': '', 'leftlon': 0, 'rightlon': 359.75, 'toplat': 90, 'bottomlat': -90, 'dir': f'/gfs.{date}/{cycle}/atmos'}; url = 'https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl'; response = requests.get(url, params=params, timeout=120); response.raise_for_status(); open('/tmp/gfs_test.grib2', 'wb').write(response.content); print('Downloaded bytes:', len(response.content)); ds = xr.open_dataset('/tmp/gfs_test.grib2', engine='cfgrib'); print('Dimensions:', dict(ds.sizes)); print('Variables:', list(ds.data_vars)); print('t2m shape:', ds['t2m'].shape); print('t2m min:', float(ds['t2m'].min())); print('t2m max:', float(ds['t2m'].max()))"

      - name: Test GFS binary conversion
        run: |
          mkdir -p data/gfs
          cp /tmp/gfs_test.grib2 data/gfs/gfs_temp_global_f000.grib2
          python processing/convert_gfs.py 0
          ls -lh data/gfs/gfs_temp_global_f000.bin

      - name: Test GFS precipitation conversion
        run: |
          python -c "import requests; from processing.download_gfs import find_latest_cycle; date, cycle = find_latest_cycle(); url = 'https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl'; base = {'var_APCP': 'on', 'lev_surface': 'on', 'subregion': '', 'leftlon': 0, 'rightlon': 359.75, 'toplat': 90, 'bottomlat': -90, 'dir': f'/gfs.{date}/{cycle}/atmos'}; [((r := requests.get(url, params={**base, 'file': f'gfs.t{cycle}z.pgrb2.0p25.f{hour:03d}'}, timeout=120)).raise_for_status(), open(f'/tmp/gfs_precip_f{hour:03d}.grib2', 'wb').write(r.content)) for hour in (3, 6)]; print('Downloaded precipitation test files')"
          cp /tmp/gfs_precip_f003.grib2 data/gfs/gfs_precip_global_f003.grib2
          cp /tmp/gfs_precip_f006.grib2 data/gfs/gfs_precip_global_f006.grib2
          python processing/convert_precip_binary.py 6
          ls -lh data/gfs/gfs_precip_global_f006.bin