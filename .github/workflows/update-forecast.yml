name: Update YouStorm Forecast

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install forecast processing packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            xarray==2026.7.0 \
            cfgrib==0.9.15.1 \
            eccodes==2.48.0 \
            ecmwf-opendata==0.3.34 \
            requests==2.34.2

      - name: Build forecast
        run: |
          python processing/update_viewer.py --force

      - name: Assemble Pages site
        run: |
          bash processing/assemble_pages.sh
          cp data/gfs/gfs_temp_global_*.bin _site/data/gfs/
          cp data/gfs/gfs_precip_global_*_u16.bin _site/data/gfs/
          cp data/gfs/gfs_temperature_metadata.json _site/data/gfs/
          cp data/gfs/gfs_precipitation_metadata.json _site/data/gfs/

          cp data/ecmwf/ecmwf_2t_*.bin _site/data/ecmwf/
          cp data/ecmwf/ecmwf_temperature_metadata.json _site/data/ecmwf/
          cp data/ecmwf/ecmwf_precip_*_u16.bin _site/data/ecmwf/
          cp data/ecmwf/ecmwf_precipitation_metadata.json _site/data/ecmwf/
          cp data/ecmwf/ecmwf_10u_f*.bin _site/data/ecmwf/
          cp data/ecmwf/ecmwf_10v_f*.bin _site/data/ecmwf/
          cp data/ecmwf/ecmwf_wind_metadata.json _site/data/ecmwf/
          cp data/ecmwf/ecmwf_msl_f*.bin _site/data/ecmwf/
          cp data/ecmwf/ecmwf_msl_metadata.json _site/data/ecmwf/

      - name: Report Pages site size
        run: |
          python - <<'PY'
          import os

          root = "_site"
          limit = 1_000_000_000
          totals = {}

          for directory, _, filenames in os.walk(root):
              for filename in filenames:
                  path = os.path.join(directory, filename)
                  size = os.path.getsize(path)
                  relative = os.path.relpath(path, root)
                  category = relative.split(os.sep)[0]
                  totals[category] = totals.get(category, 0) + size

          total = sum(totals.values())

          print(f"Uncompressed site size: {total:,} bytes")
          print(f"Decimal GB: {total / 1_000_000_000:.4f}")
          print(f"Limit used: {total / limit * 100:.2f}%")
          print(f"Remaining: {limit - total:,} bytes")

          print("\nBreakdown:")
          for category, size in sorted(
              totals.items(), key=lambda item: item[1], reverse=True
          ):
              print(
                  f"  {category}: {size:,} bytes "
                  f"({size / 1_000_000:.2f} MB)"
              )

          if total >= 900_000_000:
              print("::warning::Pages site is at or above 90% of the 1 GB limit.")
          elif total >= 800_000_000:
              print("::warning::Pages site is at or above 80% of the 1 GB limit.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4